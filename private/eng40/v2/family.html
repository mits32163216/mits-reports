<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
<title>👨‍👩‍👧 家族の設定｜英語40日プログラム</title>
<style>
:root {
  --navy:#0F1B2E; --ivory:#F5EFE1; --gold:#D4A85B; --sage:#7A9B7E; --rose:#C77B70;
  --mincho:"Hiragino Mincho ProN","游明朝",serif; --sans:"Hiragino Sans","游ゴシック",sans-serif; --mono:"SF Mono","Menlo",monospace;
  --bg:var(--ivory); --fg:var(--navy); --line:rgba(15,27,46,0.12); --card-bg:#fff; --muted:rgba(15,27,46,0.58); --sub-bg:rgba(212,168,91,0.06);
}
@media (prefers-color-scheme:dark){ :root{ --bg:var(--navy); --fg:var(--ivory); --line:rgba(245,239,225,0.14); --card-bg:#17223a; --muted:rgba(245,239,225,0.62); --sub-bg:rgba(212,168,91,0.09); } }
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--fg); font-family:var(--sans); }
body { padding:24px 20px 60px; max-width:760px; margin:0 auto; }
h1,h2,h3 { font-family:var(--mincho); font-weight:600; letter-spacing:0.02em; }
h1 { font-size:22px; margin:18px 0 4px; }
.tagline { font-family:var(--mono); font-size:11px; color:var(--muted); margin-bottom:20px; }
a { color:var(--gold); text-decoration:none; }
a:hover { text-decoration:underline; }
.eng40-family-card { margin:20px 0; padding:20px 22px; border-radius:14px;
  background:var(--card-bg); border:1px solid var(--gold); }
.eng40-family-card.setup { background:linear-gradient(135deg,rgba(212,168,91,0.16),rgba(122,155,126,0.08)); border-width:2px; }
.eng40-family-card h2 { font-size:15px; margin:0 0 10px; color:var(--gold); }
.eng40-family-card p { font-size:13.5px; line-height:1.95; margin:0 0 12px; }
.eng40-family-card .fam-note { font-size:11.5px; color:var(--muted); line-height:1.8; margin:14px 0 0; }
.eng40-family-card .fam-id { font-family:var(--mono); font-size:11.5px; color:var(--muted); margin:0 0 14px; }
.fam-btns { display:flex; flex-wrap:wrap; gap:10px; }
.fam-btn { appearance:none; -webkit-appearance:none; cursor:pointer;
  font-family:var(--sans); font-size:14px; font-weight:600; line-height:1.4;
  min-height:48px; padding:12px 20px; border-radius:10px;
  border:1px solid var(--gold); background:var(--gold); color:#fff;
  -webkit-tap-highlight-color:transparent; transition:opacity .15s; }
.fam-btn:hover { opacity:0.86; }
.fam-btn.ghost { background:transparent; color:var(--fg); border-color:var(--line); }
.fam-out { margin-top:14px; padding:12px 14px; border-radius:10px;
  background:var(--sub-bg); border:1px dashed var(--gold); }
.fam-out label { display:block; font-size:11.5px; color:var(--muted); margin-bottom:7px; }
.fam-out input { width:100%; font-family:var(--mono); font-size:12px; padding:10px 12px;
  border-radius:8px; border:1px solid var(--line); background:var(--card-bg); color:var(--fg); }
.fam-divider { height:1px; background:var(--line); margin:22px -22px 0; }
.fam-section-title { font-family:var(--mincho); font-weight:600; font-size:15px; margin:22px 0 12px; color:var(--gold); }
.fam-mode { margin-top:14px; padding:14px 16px; border-radius:10px; background:var(--sub-bg); border:1px solid var(--line); }
.fam-mode.warn { border:1.5px solid rgba(255,122,107,0.6); border-left:3px solid rgba(255,122,107,0.9); background:rgba(255,122,107,0.05); }
.fam-mode.safe { border:1.5px solid rgba(79,245,199,0.5); border-left:3px solid rgba(79,245,199,0.9); background:rgba(79,245,199,0.06); }
.fam-mode-title { font-family:var(--mincho); font-weight:600; font-size:14px; margin:0 0 6px; color:var(--fg); }
.fam-mode-desc { font-size:12.5px; line-height:1.85; margin:0 0 10px; color:var(--muted); }
.fam-mode .warn-msg { display:block; margin:8px 0 12px; padding:8px 10px; border-radius:6px; background:rgba(255,122,107,0.10); color:#c94a3a; font-size:12.5px; font-weight:600; line-height:1.7; }
.fam-mode .safe-msg { display:block; margin:8px 0 12px; padding:8px 10px; border-radius:6px; background:rgba(79,245,199,0.12); color:#2a8a70; font-size:12.5px; font-weight:600; line-height:1.7; }
@media (prefers-color-scheme:dark){
  .fam-mode.warn { background:rgba(255,122,107,0.09); }
  .fam-mode.safe { background:rgba(79,245,199,0.09); }
  .fam-mode .warn-msg { color:#ff9b8c; background:rgba(255,122,107,0.15); }
  .fam-mode .safe-msg { color:#7fead0; background:rgba(79,245,199,0.15); }
}
.back-link { display:inline-block; margin:4px 0 12px; font-family:var(--mono); font-size:12px; }
footer { margin-top:48px; padding-top:20px; border-top:1px dashed var(--line); font-family:var(--mono); font-size:11px; color:var(--muted); text-align:center; line-height:1.9; }
</style>
<link rel="stylesheet" href="./theme-v2.css?v=1">
</head>
<body>

<a class="back-link" href="./index.html">← ホームへ戻る</a>
<h1>👨‍👩‍👧 家族の設定</h1>
<div class="tagline">家族URLの共有・別家族用URLの発行はここから</div>

<div id="family-card"></div>

<footer>
  <div>📘 英語40日プログラム</div>
  <div>家族設定</div>
</footer>

<script src="./sync.js?v=4"></script>
<script>
(function () {
  var fam = window.eng40family;
  var host = document.getElementById('family-card');
  if (!fam || !host) return;

  function copyText(text, btn, okLabel) {
    var orig = btn.textContent;
    function done(ok) {
      btn.textContent = ok ? (okLabel || '✅ コピーしました') : '⚠️ 長押しでコピーしてください';
      setTimeout(function () { btn.textContent = orig; }, 2200);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
        return;
      }
    } catch (e) {}
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      done(!!ok);
    } catch (e2) { done(false); }
  }

  function showUrl(labelText, url) {
    var box = document.getElementById('fam-out');
    if (!box) return;
    box.innerHTML = '';
    box.style.display = 'block';
    var lab = document.createElement('label');
    lab.textContent = labelText;
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.readOnly = true;
    inp.value = url;
    inp.addEventListener('focus', function () { inp.select(); });
    var btn = document.createElement('button');
    btn.className = 'fam-btn';
    btn.style.marginTop = '10px';
    btn.textContent = '📋 このURLをコピー';
    btn.addEventListener('click', function () { copyText(url, btn); });
    box.appendChild(lab);
    box.appendChild(inp);
    box.appendChild(btn);
  }

  var NOTE = '家族URLを知っている人だけがその家族の記録を見られます。他の家族の記録は見えません。';

  if (!fam.isSet()) {
    host.innerHTML =
      '<div class="eng40-family-card setup">' +
        '<h2>👨‍👩‍👧 まずは家族を作る</h2>' +
        '<p>この端末はまだどの家族にもつながっていません。' +
        '「この家族で始める」を押すと専用のURLができて、チェックした記録が家族の端末どうしで共有されます。</p>' +
        '<div class="fam-btns"><button class="fam-btn" id="fam-start">この家族で始める</button></div>' +
        '<p class="fam-note">' + NOTE + '</p>' +
      '</div>';
    document.getElementById('fam-start').addEventListener('click', function () {
      fam.adopt(fam.generate());
    });
    return;
  }

  // 個人ID：'p' 始まりの16文字（先頭 p + 残り15文字 [a-z0-9]）→ Worker validation /^[a-z0-9]{6,32}$/ 通過
  function newPersonalId() {
    return 'p' + fam.generate().slice(1);
  }

  host.innerHTML =
    '<div class="eng40-family-card">' +
      '<h2>👨‍👩‍👧 現在の家族設定</h2>' +
      '<p class="fam-id">📍 この端末の家族ID：****' + fam.tail() + '</p>' +

      '<div class="fam-divider"></div>' +
      '<div class="fam-section-title">📤 URL を渡す</div>' +

      '<div class="fam-mode warn">' +
        '<div class="fam-mode-title">🏠 自分の家族の別端末に渡す</div>' +
        '<p class="fam-mode-desc">親御さんの iPhone・子どもの iPad など、<b>同じ家族の別端末</b>にこのURLを渡すと同じ記録が見られます。</p>' +
        '<span class="warn-msg">⚠️ 自分の学習記録が丸ごと見えます。友達には絶対に渡さないでください。</span>' +
        '<div class="fam-btns"><button class="fam-btn" id="fam-copy">📋 家族URLをコピー</button></div>' +
      '</div>' +

      '<div class="fam-divider"></div>' +
      '<div class="fam-section-title">🆕 新しく発行する</div>' +

      '<div class="fam-mode safe">' +
        '<div class="fam-mode-title">👥 友達の家族に空のURLを配る</div>' +
        '<p class="fam-mode-desc">友達の家族に配るときは、こちらから発行してください。相手には<b>新しい空の40日プログラム</b>が渡ります。</p>' +
        '<span class="safe-msg">✅ あなたの学習記録は一切見えません。安心して配れます。</span>' +
        '<div class="fam-btns"><button class="fam-btn" id="fam-new-friend">友達用URLを発行</button></div>' +
      '</div>' +

      '<div class="fam-mode">' +
        '<div class="fam-mode-title">👤 個人で使う</div>' +
        '<p class="fam-mode-desc"><b>1人だけの記録</b> として使います。家族の共有記録には混ざりません（子どもが1人で使う・親が試しに使う場合など）。</p>' +
        '<div class="fam-btns">' +
          '<button class="fam-btn" id="fam-new-personal">個人URLを発行</button>' +
          '<button class="fam-btn ghost" id="fam-switch-personal">この端末を個人URLに切り替える</button>' +
        '</div>' +
      '</div>' +

      '<div class="fam-out" id="fam-out" style="display:none"></div>' +

      '<p class="fam-note">' + NOTE +
        '<br>「家族URLをコピー」＝この家族の別の端末（お父さん・お母さんのスマホ）に渡すURL。<b>自分の記録が見えるので友達に渡さない</b>。' +
        '<br>「友達用URLを発行」＝別の家族（友達など）に渡す新しい空のURL。相手には空のプログラムが渡ります。' +
        '<br>「個人URLを発行」＝1人専用の新しいURLを作って渡す。この端末の家族は変わりません。' +
        '<br>「この端末を個人URLに切り替える」＝この端末自体を個人用に付け替える（現在の家族データはサーバに残るので、家族URLを開けば元に戻せます）。</p>' +
    '</div>';

  document.getElementById('fam-copy').addEventListener('click', function () {
    var url = fam.myUrl();
    copyText(url, this);
    showUrl('この家族のURL（家族の他の端末で開く・⚠️自分の記録が見えます）', url);
  });

  document.getElementById('fam-new-friend').addEventListener('click', function () {
    var url = fam.urlFor(fam.generate());
    showUrl('友達用のURL（相手には空のプログラムが渡ります・あなたの記録は見えません）', url);
  });

  document.getElementById('fam-new-personal').addEventListener('click', function () {
    var url = fam.urlFor(newPersonalId());
    showUrl('個人用のURL（1人専用の記録になります）', url);
  });

  document.getElementById('fam-switch-personal').addEventListener('click', function () {
    var pid = newPersonalId();
    var msg =
      'この端末の家族設定を「個人用」に切り替えます。\n\n' +
      '現在の家族（****' + fam.tail() + '）の記録とは完全に分離され、\n' +
      'この端末では今後は個人用の空の記録から始まります。\n' +
      '（現在の家族データはサーバに残っており、家族URLを開き直せば元に戻せます）\n\n' +
      '続行しますか？';
    if (!window.confirm(msg)) return;
    // 旧家族の eng40- キーをローカルから消してから adopt。
    // 消さないと新しい個人KVに旧家族のデータが押し出されて混ざる。
    try {
      var doomed = [], i, k;
      for (i = 0; i < localStorage.length; i++) {
        k = localStorage.key(i);
        if (k && k.indexOf('eng40-') === 0) doomed.push(k);
      }
      for (i = 0; i < doomed.length; i++) localStorage.removeItem(doomed[i]);
      localStorage.removeItem('eng40sync-serverAt');
      localStorage.removeItem('eng40sync-dirty');
    } catch (e) {}
    fam.adopt(pid);
  });
})();
</script>
<script src="./nav.js?v=6"></script>
</body>
</html>
