<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<title>遷移率と売上の試算 ── 出し続ける AI経営 3DAYS</title>
<style>
:root {
  --navy:#0F1B2E; --ivory:#F5EFE1; --gold:#D4A85B; --sage:#7A9B7E; --rose:#C77B70;
  --mincho:"Hiragino Mincho ProN","游明朝",serif; --sans:"Hiragino Sans","游ゴシック",sans-serif; --mono:"SF Mono","Menlo",monospace;
  --bg:var(--ivory); --fg:var(--navy); --line:rgba(15,27,46,0.12); --card-bg:#fff; --muted:rgba(15,27,46,0.58); --sub-bg:rgba(212,168,91,0.06);
  --zebra:rgba(15,27,46,0.055);
  --a-bg:rgba(122,155,126,0.10); --b-bg:rgba(199,123,112,0.10);
  --a-mark:var(--sage); --b-mark:var(--rose);
  --warn-fg:#B04A3A; --warn-bg:rgba(199,123,112,0.22);
}
@media (prefers-color-scheme:dark){
  :root {
    --bg:var(--navy); --fg:var(--ivory); --line:rgba(245,239,225,0.14); --card-bg:#17223a; --muted:rgba(245,239,225,0.62); --sub-bg:rgba(212,168,91,0.09);
    --zebra:rgba(245,239,225,0.065);
    --a-bg:rgba(122,155,126,0.16); --b-bg:rgba(199,123,112,0.18);
    --warn-fg:#E28575; --warn-bg:rgba(199,123,112,0.24);
  }
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--fg); font-family:var(--sans); }
body { padding:16px 12px 120px; max-width:820px; margin:0 auto; font-variant-numeric: tabular-nums; }
h1,h2,h3 { font-family:var(--mincho); font-weight:600; letter-spacing:0.02em; }
a { color:var(--gold); text-decoration:none; overflow-wrap:anywhere; }

.hero { text-align:center; padding:8px 0 4px; }
.hero h1 { font-size:22px; margin:0 0 4px; }
.hero .tag { font-family:var(--mono); font-size:11px; color:var(--muted); }
.back { display:inline-block; margin-bottom:4px; font-family:var(--mono); font-size:11px; }

.sticky-top { position:sticky; top:0; z-index:20; background:var(--bg); padding:8px 0; border-bottom:1px solid var(--line); margin-bottom:14px; }
.plan-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media (max-width:640px){ .plan-grid { grid-template-columns:1fr; } }
.plan-box { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--card-bg); }
.plan-box.A { border-color:var(--a-mark); background:var(--a-bg); }
.plan-box.B { border-color:var(--b-mark); background:var(--b-bg); }
.plan-box h3 { margin:0 0 6px; font-size:13px; font-family:var(--mono); letter-spacing:0.04em; }
.plan-box.A h3 { color:var(--a-mark); }
.plan-box.B h3 { color:var(--b-mark); }

table.money { width:100%; border-collapse:collapse; font-size:12px; }
table.money td { padding:3px 6px; border-bottom:1px dashed var(--line); }
table.money tr:last-child td { border-bottom:none; font-weight:600; font-family:var(--mincho); font-size:14px; }
table.money td.n { font-family:var(--mono); text-align:right; white-space:nowrap; }

.kpi { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
.kpi .k { border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:rgba(255,255,255,0.4); }
@media (prefers-color-scheme:dark){ .kpi .k { background:rgba(0,0,0,0.15); } }
.kpi .k .t { font-family:var(--mono); font-size:10px; color:var(--muted); line-height:1.3; }
.kpi .k .v { font-family:var(--mincho); font-size:16px; margin-top:2px; }
.kpi .k .s { font-size:10px; color:var(--muted); margin-top:1px; line-height:1.3; }

.genre { margin:24px 0 6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.genre h2 { font-size:15px; margin:0; }
.genre::after { content:""; flex:1; border-top:1px dashed var(--line); min-width:20px; }
.genre .note { font-family:var(--mono); font-size:11px; color:var(--muted); }

table.main6 { width:100%; border-collapse:collapse; font-size:12px; background:var(--card-bg);
  border:1px solid var(--line); border-radius:10px; overflow:hidden; }
table.main6 th, table.main6 td { padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
table.main6 tr:last-child td { border-bottom:none; }
table.main6 tr.dan-start td { border-top:2px solid var(--gold); }
table.main6 th { font-family:var(--mono); font-size:10.5px; color:var(--muted); font-weight:400; background:var(--sub-bg); text-align:left; white-space:nowrap; border-top:none; }
table.main6 th.A { color:var(--a-mark); }
table.main6 th.B { color:var(--b-mark); }

table.main6 col.col-dan   { width:16%; }
table.main6 col.col-lab   { width:32%; }
table.main6 col.col-A     { width:26%; }
table.main6 col.col-B     { width:26%; }

/* 縦罫 白灰交互（4列：段=灰・項目=白・A=独自色・B=独自色） */
table.main6 tbody td.dan   { background:var(--zebra); }
table.main6 tbody td.lab   { background:transparent; }
table.main6 tbody td.plan.A { background:var(--a-bg); }
table.main6 tbody td.plan.B { background:var(--b-bg); }

table.main6 td.dan { font-family:var(--mincho); font-size:12.5px; font-weight:600; color:var(--gold); vertical-align:top; padding-top:8px; line-height:1.35; }
table.main6 td.lab { font-size:12.5px; line-height:1.4; }
table.main6 td.plan { text-align:right; white-space:nowrap; }
table.main6 td.plan .inp { display:flex; align-items:center; gap:3px; justify-content:flex-end; flex-wrap:wrap; }
table.main6 td.plan input[type=number] { width:110px; padding:4px 6px; text-align:right; font-family:var(--mono); font-size:13px;
  border:1px solid var(--line); border-radius:6px; background:var(--card-bg); color:var(--fg); }
table.main6 td.plan input[type=number]:focus { outline:none; }
table.main6 td.plan.A input[type=number]:focus { border-color:var(--a-mark); }
table.main6 td.plan.B input[type=number]:focus { border-color:var(--b-mark); }
table.main6 td.plan .unit { font-family:var(--mono); font-size:11px; color:var(--muted); }
table.main6 td.plan .stat { font-family:var(--mono); font-size:13px; font-weight:600; }
table.main6 td.plan.A .stat { color:var(--a-mark); }
table.main6 td.plan.B .stat { color:var(--b-mark); }
table.main6 td.plan .dash { color:var(--muted); font-family:var(--mono); font-size:12px; }

@media (max-width:640px){
  table.main6 { font-size:12px; }
  table.main6 col.col-dan { width:18%; }
  table.main6 col.col-lab { width:34%; }
  table.main6 col.col-A, table.main6 col.col-B { width:24%; }
  table.main6 td.plan input[type=number] { width:74px; }
  table.main6 td.dan { font-size:11.5px; padding-top:6px; }
}

.btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center; }
button.act { font-family:var(--sans); font-size:12px; padding:7px 12px; border-radius:8px;
  border:1px solid var(--line); background:var(--card-bg); color:var(--fg); cursor:pointer; }
button.act:hover { border-color:var(--gold); }
button.act.p { background:var(--gold); border-color:var(--gold); color:#fff; }
.act-msg { font-family:var(--mono); font-size:11px; color:var(--muted); }

.memo { font-size:12px; color:var(--muted); line-height:1.85; margin-top:14px;
  background:var(--card-bg); border:1px solid var(--line); border-radius:10px; padding:12px 14px;
  overflow-wrap:anywhere; word-break:break-word; }
.memo b { color:var(--fg); font-weight:600; }
.memo .a-mark { color:var(--a-mark); font-weight:600; }
.memo .b-mark { color:var(--b-mark); font-weight:600; }
.memo .wasa-mark { color:var(--gold); font-weight:600; }

footer { margin-top:32px; padding-top:14px; border-top:1px dashed var(--line);
  font-family:var(--mono); font-size:11px; color:var(--muted); text-align:center; line-height:1.7; }
</style>
</head>
<body>

<div class="hero">
  <a class="back" href="https://reports.7years.life/private/marketing/">← マーケティング</a>
  <h1>📊 遷移率と売上の試算</h1>
  <div class="tag">2026-09-20 ／ PLAN A と FBM式 を独立で回して見比べる</div>
</div>

<div class="sticky-top" id="topResult">
  <div class="plan-grid">
    <div class="plan-box A">
      <h3>■ PLAN A ── 結果</h3>
      <table class="money" id="tbl_money_A"></table>
      <div class="kpi" id="kpi_A"></div>
    </div>
    <div class="plan-box B">
      <h3>■ FBM式 ── 結果</h3>
      <table class="money" id="tbl_money_B"></table>
      <div class="kpi" id="kpi_B"></div>
    </div>
  </div>
</div>

<div class="genre"><h2>打ち込む数字</h2><span class="note">段・項目・PLAN A・FBM式（縦罫は白灰交互）</span></div>
<table class="main6" id="tbl_main">
  <colgroup>
    <col class="col-dan"><col class="col-lab"><col class="col-A"><col class="col-B">
  </colgroup>
</table>

<div class="genre"><h2>下流から逆に</h2><span class="note">結果の数字を打つと 投下する広告費 が逆算される（PLAN A / FBM式 独立）</span></div>
<table class="main6" id="tbl_rev">
  <colgroup>
    <col class="col-dan"><col class="col-lab"><col class="col-A"><col class="col-B">
  </colgroup>
</table>

<div class="btns">
  <button class="act p" id="save">この数字を保存</button>
  <button class="act" id="reset">もとに戻す</button>
  <span class="act-msg" id="msg"></span>
</div>

<div class="memo" id="memo"></div>

<footer>
  プライベート・非公開エリア（noindex, nofollow）<br>
  数字はこのブラウザにだけ保存されます。他の人には共有されません。
</footer>

<script>
var DEFAULT = {
  koukoku_in:900000, cpm:6000, ctr:1.5, muryo:0,
  optin:20, tf:20,
  oto:15, kikan:10, oto2:5,
  keizoku:0, tanka_keizoku:0, tsuki:0,
  tanka_front:29800, tanka_oto:58000, tanka_oto2:88000, genka:5
};
var SA = {}, SB = {};
function loadDefault(){
  SA = {}; SB = {};
  for (var k in DEFAULT){ SA[k]=DEFAULT[k]; SB[k]=DEFAULT[k]; }
}
function load(){
  loadDefault();
  try {
    var raw = localStorage.getItem("marketing_shisan_v4");
    if (raw) {
      var o = JSON.parse(raw);
      if (o && o.A) for (var kA in o.A) if (SA.hasOwnProperty(kA) && typeof o.A[kA]==="number" && isFinite(o.A[kA])) SA[kA]=o.A[kA];
      if (o && o.B) for (var kB in o.B) if (SB.hasOwnProperty(kB) && typeof o.B[kB]==="number" && isFinite(o.B[kB])) SB[kB]=o.B[kB];
    }
  } catch(e) { console.error("load failed:", e); }
}
function saveNow(){
  try { localStorage.setItem("marketing_shisan_v4", JSON.stringify({A:SA, B:SB})); }
  catch(e) { console.error("saveNow failed:", e); }
}

function yen(n){ if (!isFinite(n)) return "—"; return Math.round(n).toLocaleString("ja-JP"); }
function nin(n){ if (!isFinite(n)) return "—"; return Math.floor(n).toLocaleString("ja-JP"); }
function pct(n){ if (!isFinite(n)) return "—"; return (Math.round(n*10)/10).toLocaleString("ja-JP"); }

var SECTIONS = [
  { dan:"広告先", rows:[
    {lab:"投下する広告費", kind:"input", key:"koukoku_in", unit:"円"},
    {lab:"表示1,000回あたり（CPM）", wasa:{amb:"9,000円"}, kijun:{label:"3,000〜14,000円"}, kind:"input", key:"cpm", unit:"円"},
    {lab:"広告の表示回数（IMP）", wasa:{amb:"111,000回"}, kind:"calc", out:"imp"},
    {lab:"クリック率（CTR）", wasa:{amb:"1.5%"}, kijun:{label:"1.50%"}, kind:"input", key:"ctr", unit:"%"},
    {lab:"広告で買うアクセス（クリック数）", kind:"calc", out:"clicks"},
    {lab:"クリック単価（CPC）", wasa:{amb:"600円"}, kijun:{label:"300円"}, kind:"calc", out:"cpc"}
  ]},
  { dan:"01 オプトインページ", rows:[
    {lab:"無料で来る人数（おまけ）", kind:"input", key:"muryo", unit:"人"},
    {lab:"入口ページに来た人数", kind:"calc", out:"entrance"},
    {lab:"メルマガ登録率（CVR）", wasa:{amb:"20%"}, kijun:{label:"5〜20%"}, kind:"input", key:"optin", unit:"%"},
    {lab:"メルマガ登録数", kind:"calc", out:"toroku"},
    {lab:"登録1件の広告費（CPA）", wasa:{primary:"2,000円以下"}, kijun:{label:"3,000〜5,000円"}, kind:"calc", out:"cpa"}
  ]},
  { dan:"02 サンクスページ", rows:[
    {lab:"LINE登録率（参考）", kijun:{label:"60%"}, kind:"dash"}
  ]},
  { dan:"03 第0章の動画ページ", rows:[
    {lab:"見た人", kind:"calc", out:"mita"}
  ]},
  { dan:"04 フロント商品のLP", rows:[
    {lab:"登録 → フロント購入", wasa:{primary:"20%超"}, kind:"input", key:"tf", unit:"%"},
    {lab:"フロントを買った人", kind:"calc", out:"kounyu"},
    {lab:"フロントの価格", kind:"input", key:"tanka_front", unit:"円"},
    {lab:"フロント売上", kind:"calc", out:"u_front"}
  ]},
  { dan:"05 申込フォーム（重ね窓）", rows:[
    {lab:"フォームは 04 の重ね窓（率の別項なし）", kind:"dash"}
  ]},
  { dan:"06 ワンタイムオファーのLP", rows:[
    {lab:"直後の購入率", kind:"input", key:"oto", unit:"%"},
    {lab:"直後の購入人数", kind:"calc", out:"oto"},
    {lab:"直後の価格", kind:"input", key:"tanka_oto", unit:"円"},
    {lab:"直後の売上", kind:"calc", out:"u_oto"}
  ]},
  { dan:"06x ワンタイムオファーの定価ページ", rows:[
    {lab:"ページ帰還率", kind:"input", key:"kikan", unit:"%"},
    {lab:"アクセス数", kind:"calc", out:"oto2_access"},
    {lab:"定価の購入率", kind:"input", key:"oto2", unit:"%"},
    {lab:"買った人", kind:"calc", out:"oto2"},
    {lab:"定価の価格", kind:"input", key:"tanka_oto2", unit:"円"},
    {lab:"定価の売上", kind:"calc", out:"u_oto2"}
  ]},
  { dan:"継続（AI経営PRO）", rows:[
    {lab:"継続率（フロント購入者の何%が継続）", kind:"input", key:"keizoku", unit:"%"},
    {lab:"継続の人数", kind:"calc", out:"keizoku_ninzu"},
    {lab:"継続の価格（月額）", kind:"input", key:"tanka_keizoku", unit:"円"},
    {lab:"継続の月数", kind:"input", key:"tsuki", unit:"ヶ月"},
    {lab:"継続の売上", kind:"calc", out:"u_keizoku"}
  ]},
  { dan:"08 申込完了ページ", rows:[
    {lab:"（人数・売上は上流で確定）", kind:"dash"}
  ]},
  { dan:"お金と基準", rows:[
    {lab:"売上原価率", kind:"input", key:"genka", unit:"%"},
    {lab:"広告費の回収率（ROAS）", wasa:{primary:"500%（最低）／ 700%超（現行）"}, kind:"calc", out:"roas"}
  ]}
];

var LAYOUT_REV = [
  {lab:"登録数",           key:"toroku", unit:"人"},
  {lab:"フロントを買った人", key:"kounyu", unit:"人"},
  {lab:"売上の合計",       key:"uriage", unit:"円"},
  {lab:"手元に残る額",     key:"eki",    unit:"円"}
];

function cellHtml(r, plan){
  var cls = 'plan ' + plan;
  var html = '';
  if (r.kind === "input") {
    html = '<div class="inp"><input type="number" data-k="' + r.key + '" data-plan="' + plan + '" step="any"><span class="unit">' + r.unit + '</span></div>';
  } else if (r.kind === "calc") {
    html = '<div class="stat" data-out-' + plan + '="' + r.out + '"></div>';
  } else if (r.kind === "dash") {
    html = '<span class="dash">—</span>';
  }
  return '<td class="' + cls + '">' + html + '</td>';
}

function buildMain(){
  var t = document.getElementById("tbl_main");
  var head = '<thead><tr><th>段</th><th>項目</th><th class="A">我が社 PLAN A</th><th class="B">FBM式</th></tr></thead>';
  var body = '<tbody>';
  for (var s=0; s<SECTIONS.length; s++){
    var sec = SECTIONS[s];
    for (var i=0; i<sec.rows.length; i++){
      var r = sec.rows[i];
      var isFirst = (i === 0);
      body += '<tr' + (isFirst ? ' class="dan-start"' : '') + '>';
      if (isFirst) body += '<td class="dan" rowspan="' + sec.rows.length + '">' + sec.dan + '</td>';
      body += '<td class="lab">' + r.lab + '</td>';
      body += cellHtml(r, "A") + cellHtml(r, "B");
      body += '</tr>';
    }
  }
  body += '</tbody>';
  t.innerHTML = head + body;
}

function buildRev(){
  var t = document.getElementById("tbl_rev");
  var head = '<thead><tr><th>段</th><th>項目</th><th class="A">我が社 PLAN A</th><th class="B">FBM式</th></tr></thead>';
  var body = '<tbody>';
  for (var i=0; i<LAYOUT_REV.length; i++){
    var r = LAYOUT_REV[i];
    var isFirst = (i === 0);
    body += '<tr' + (isFirst ? ' class="dan-start"' : '') + '>';
    if (isFirst) body += '<td class="dan" rowspan="' + LAYOUT_REV.length + '">逆算入力</td>';
    body += '<td class="lab">' + r.lab + '</td>';
    ["A","B"].forEach(function(plan){
      body += '<td class="plan ' + plan + '">' +
        '<div class="inp"><input type="number" data-rev="' + r.key + '" data-plan="' + plan + '" step="any"><span class="unit">' + r.unit + '</span></div>' +
        '<div class="stat" data-out-' + plan + '="rev_' + r.key + '"></div>' +
      '</td>';
    });
    body += '</tr>';
  }
  body += '</tbody>';
  t.innerHTML = head + body;
}

function getS(plan){ return plan === "A" ? SA : SB; }

function bindInputs(){
  document.querySelectorAll('input[type="number"][data-k]').forEach(function(el){
    el.addEventListener("input", function(ev){
      var k = ev.target.getAttribute("data-k");
      var plan = ev.target.getAttribute("data-plan");
      var v = parseFloat(ev.target.value);
      if (!isFinite(v)) return;
      getS(plan)[k] = v;
      clearReverseInputs();
      calc();
      saveNow();
    });
  });
  document.querySelectorAll('input[type="number"][data-rev]').forEach(function(el){
    el.addEventListener("input", function(ev){
      var kind = ev.target.getAttribute("data-rev");
      var plan = ev.target.getAttribute("data-plan");
      var v = parseFloat(ev.target.value);
      if (!isFinite(v) || v <= 0) return;
      var ok = reverseKoukoku(plan, kind, v);
      if (!ok) return;
      syncInputs();
      calc();
      saveNow();
    });
  });
}
function clearReverseInputs(){
  document.querySelectorAll('input[type="number"][data-rev]').forEach(function(e){ e.value = ""; });
}

function reverseKoukoku(plan, kind, X){
  var S = getS(plan);
  if (S.optin <= 0 || S.ctr <= 0 || S.cpm <= 0) return false;
  var tfFrac = S.tf/100;
  var factor_kounyu = S.tanka_front + (S.oto/100)*S.tanka_oto + (S.keizoku/100)*S.tanka_keizoku*S.tsuki;
  var factor_toroku = (S.kikan/100)*(S.oto2/100)*S.tanka_oto2;
  var G = tfFrac * factor_kounyu + factor_toroku;
  var toroku_target;
  if (kind === "toroku")      toroku_target = X;
  else if (kind === "kounyu") { if (tfFrac <= 0) return false; toroku_target = X / tfFrac; }
  else if (kind === "uriage") { if (G <= 0) return false; toroku_target = X / G; }
  else if (kind === "eki") {
    var g = 1 - S.genka/100;
    var A = (S.ctr * S.optin * G * g) / (S.cpm * 10);
    var B = (S.muryo * S.optin * G * g) / 100;
    var denom = A - 1;
    if (denom === 0) return false;
    var K_new = (X - B) / denom;
    if (!isFinite(K_new) || K_new <= 0) return false;
    S.koukoku_in = K_new;
    return true;
  } else return false;
  if (!isFinite(toroku_target) || toroku_target <= 0) return false;
  var p_target = toroku_target * 100 / S.optin;
  var clicks_target = p_target - S.muryo;
  if (clicks_target <= 0) return false;
  var imp_target = clicks_target * 100 / S.ctr;
  var K_new = imp_target * S.cpm / 1000;
  if (!isFinite(K_new) || K_new < 0) return false;
  S.koukoku_in = K_new;
  return true;
}

function syncInputs(){
  document.querySelectorAll('input[type="number"][data-k]').forEach(function(el){
    var k = el.getAttribute("data-k");
    var plan = el.getAttribute("data-plan");
    var v = getS(plan)[k];
    var display = (k === "koukoku_in") ? String(Math.round(v)) : String(v);
    if (el.value !== display) el.value = display;
  });
}

function setStat(plan, key, text){
  document.querySelectorAll('[data-out-' + plan + '="' + key + '"]').forEach(function(e){ e.textContent = text; });
}
function markInput(plan, key, ok){
  var el = document.querySelector('input[data-k="' + key + '"][data-plan="' + plan + '"]');
  if (!el) return;
  if (ok) el.classList.remove("warn"); else el.classList.add("warn");
}
function markCalc(plan, key, ok){
  var el = document.querySelector('[data-out-' + plan + '="' + key + '"]');
  if (!el) return;
  if (ok) el.classList.remove("warn"); else el.classList.add("warn");
}

function calcPlan(plan){
  var S = getS(plan);
  var K = S.koukoku_in;
  var imp = S.cpm > 0 ? K / S.cpm * 1000 : 0;
  var clicks = imp * S.ctr / 100;
  var clicks_i = Math.floor(clicks);
  var cpc = clicks_i > 0 ? K / clicks_i : 0;
  var p = clicks + S.muryo;
  var toroku = p * S.optin/100;
  var toroku_i = Math.floor(toroku);
  var cpa = toroku_i > 0 ? K / toroku_i : 0;
  var mita = toroku;
  var kounyu = toroku * S.tf/100;
  var oto = kounyu * S.oto/100;
  var oto2_access = toroku * S.kikan/100;
  var oto2 = oto2_access * S.oto2/100;
  var keizoku_ninzu = Math.floor(kounyu) * S.keizoku/100;

  var u_front    = Math.floor(kounyu) * S.tanka_front;
  var u_oto      = Math.floor(oto)    * S.tanka_oto;
  var u_oto2     = Math.floor(oto2)   * S.tanka_oto2;
  var u_keizoku  = Math.floor(keizoku_ninzu) * S.tanka_keizoku * S.tsuki;
  var uriage     = u_front + u_oto + u_oto2 + u_keizoku;
  var genka      = uriage * S.genka/100;
  var arari      = uriage - genka;
  var eki        = arari - K;
  var roas       = K > 0 ? uriage/K*100 : 0;

  setStat(plan, "imp",           yen(imp) + " 回");
  setStat(plan, "clicks",        nin(clicks) + " 人");
  setStat(plan, "cpc",           yen(cpc) + " 円");
  setStat(plan, "entrance",      nin(p) + " 人");
  setStat(plan, "toroku",        nin(toroku) + " 人");
  setStat(plan, "cpa",           yen(cpa) + " 円");
  setStat(plan, "mita",          nin(mita) + " 人");
  setStat(plan, "kounyu",        nin(kounyu) + " 人");
  setStat(plan, "u_front",       yen(u_front) + " 円");
  setStat(plan, "oto",           nin(oto) + " 人");
  setStat(plan, "u_oto",         yen(u_oto) + " 円");
  setStat(plan, "oto2_access",   nin(oto2_access) + " 人");
  setStat(plan, "oto2",          nin(oto2) + " 人");
  setStat(plan, "u_oto2",        yen(u_oto2) + " 円");
  setStat(plan, "keizoku_ninzu", nin(keizoku_ninzu) + " 人");
  setStat(plan, "u_keizoku",     yen(u_keizoku) + " 円");
  setStat(plan, "roas",          pct(roas) + "%");

  setStat(plan, "rev_toroku", "計算値 " + nin(toroku) + " 人");
  setStat(plan, "rev_kounyu", "計算値 " + nin(kounyu) + " 人");
  setStat(plan, "rev_uriage", "計算値 " + yen(uriage) + " 円");
  setStat(plan, "rev_eki",    "計算値 " + yen(eki) + " 円");

  var h = '';
  h += '<tr><td>売上の合計</td><td class="n">' + yen(uriage) + ' 円</td></tr>';
  h += '<tr><td>売上原価（' + S.genka + '%）</td><td class="n">−' + yen(genka) + ' 円</td></tr>';
  h += '<tr><td>広告費</td><td class="n">−' + yen(K) + ' 円</td></tr>';
  h += '<tr><td>手元に残る額</td><td class="n">' + yen(eki) + ' 円</td></tr>';
  document.getElementById("tbl_money_" + plan).innerHTML = h;

  var per_in   = p > 0 ? arari / p : 0;
  var per_lead = toroku > 0 ? arari / toroku : 0;
  var ltv      = kounyu > 0 ? uriage / kounyu : 0;
  var need     = per_in > 0 ? 20000000 / per_in : 0;
  var k = "";
  k += '<div class="k"><div class="t">登録→フロント購入</div><div class="v">' + pct(S.tf) + '%</div><div class="s">段の遷移率</div></div>';
  k += '<div class="k"><div class="t">ROAS</div><div class="v">' + pct(roas) + '%</div><div class="s">広告費の回収率</div></div>';
  k += '<div class="k"><div class="t">CPC</div><div class="v">' + yen(cpc) + ' 円</div><div class="s">1クリックの単価</div></div>';
  k += '<div class="k"><div class="t">投下する広告費</div><div class="v">' + yen(K) + ' 円</div><div class="s">起点</div></div>';
  k += '<div class="k"><div class="t">入口1人の粗利</div><div class="v">' + yen(per_in) + ' 円</div><div class="s">1人あたりここまで払える</div></div>';
  k += '<div class="k"><div class="t">登録1人の粗利</div><div class="v">' + yen(per_lead) + ' 円</div><div class="s">CPA との差</div></div>';
  k += '<div class="k"><div class="t">買った人1人の売上</div><div class="v">' + yen(ltv) + ' 円</div><div class="s">フロント＋ワンタイムオファー＋定価ページ＋継続</div></div>';
  k += '<div class="k"><div class="t">粗利2,000万円に必要な入口</div><div class="v">' + yen(need) + ' 人</div><div class="s">この商品だけで到達</div></div>';
  document.getElementById("kpi_" + plan).innerHTML = k;
}

function calc(){
  calcPlan("A");
  calcPlan("B");
}
