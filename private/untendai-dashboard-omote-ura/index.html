ont-size:12px;font-weight:400;color:#b45309;margin-top:3px}.content{min-width:0;padding:28px 36px 40px}.placeholder{margin:0;color:#76766f}.breadcrumb{font-size:12px;color:#76766f;margin:0 0 20px;overflow-wrap:anywhere}.content h2{font-size:21px;line-height:1.6;margin:0 0 16px;overflow-wrap:anywhere}.kind{display:inline-block;font-size:12px;font-weight:600;color:var(--kind);border:1px solid currentColor;border-radius:5px;padding:3px 10px;margin-bottom:18px}.frame{height:220px;border:1px dashed #bdbdb5;border-radius:10px;background:#fcfcfa;display:flex;align-items:center;justify-content:center;color:#76766f;padding:20px}.frame.ura{height:120px}.all-section{padding:28px 32px 40px}.all-section>h2{font-size:18px;margin:0 0 18px}.all-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.all{border:1px solid #e6e6e3;border-radius:10px;padding:18px 20px;min-width:0}.all h3{font-size:17px;margin:0 0 8px}.counts{font-size:12px;color:#76766f;margin:0 0 18px}.all-row{line-height:1.6;padding:4px 0;overflow-wrap:anywhere}.all-row.dai{font-weight:700;font-size:1.2rem;margin-top:14px;padding-top:12px;border-top:1px solid #e6e6e3}.all-row.chu{padding-left:18px;font-weight:600;margin-top:6px}.all-row.detail{padding-left:36px}@media(max-width:680px){header{padding:20px}h1{font-size:20px}.switcher{padding:18px 20px}.layout,.all-grid{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #e6e6e3;min-height:0}.content{padding:24px 20px}.all-section{padding:24px 20px}.tab{padding:10px 12px}.all{padding:16px}}

.executive-grid,.diagram-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.executive-section{border:1px solid #e6e6e3;border-radius:10px;padding:14px;min-width:0}.section-head{font-weight:700;font-size:1.2rem;margin-bottom:12px}.diagram{height:150px;flex-direction:column;justify-content:center;text-align:center;margin:0}.diagram.small{height:70px;padding:8px;font-size:13px}.diagram small{font-size:11px;font-weight:400;color:#76766f}.diagram:hover{background:#f2f2ef}.detail-frame{height:260px}.screen-label{font-size:12px;color:#76766f;margin:-8px 0 20px}.crumb{display:inline-flex;padding:0;border-radius:2px;vertical-align:baseline;font-size:inherit;color:inherit}.crumb:hover{text-decoration:underline}.setting-section{display:flex;gap:8px;align-items:center;border:1px solid #deded9;border-radius:8px;padding:18px;min-height:76px}.setting-section .dot{order:-1}.item-count{margin-left:auto;color:#76766f}.kind-heading{display:flex;align-items:baseline;gap:6px}.setting-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,40%);gap:16px;padding:10px 0;border-bottom:1px solid #e6e6e3}.input-shape{display:block;height:34px;border:1px solid #deded9;border-radius:5px;background:#fff}.row:focus-visible{outline:2px solid #1d4ed8;outline-offset:2px}@media(max-width:680px){.executive-grid,.diagram-grid{grid-template-columns:1fr}}

<script>
'use strict';
const DATA=JSON.parse(document.getElementById('kaisou-data').textContent);
const COLORS={'決定':'#1d4ed8','設定':'#6b7280','接続・取り込み':'#15803d'};
const state={side:'omote',omote:{open:new Set(),selected:{type:'top',t:0,key:'top-0'}},ura:{open:new Set(),selected:{type:'top',t:0,key:'top-0'}}};
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function appendName(parent,name){
  const label=element('span','label');
  const effect='→ 実行でマーケティングに影響';
  const withoutEffect=name.replace(effect,'');
  const match=withoutEffect.match(/〔(?:足した詳細|画面なし)〕$/u);
  label.appendChild(element('span','name',match?withoutEffect.slice(0,-match[0].length):withoutEffect));
  if(match)label.appendChild(element('span','note',match[0]));
  if(name.includes(effect))label.appendChild(element('span','effect',effect));
  parent.appendChild(label);
}
function dot(parent,kind){const e=element('span','dot');e.style.setProperty('--kind',COLORS[kind]);e.setAttribute('aria-hidden','true');parent.appendChild(e);}
function bind(row,action){row.addEventListener('click',action);row.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();action();}});}
function row(name,level,key,kind){
  const r=element('div','row '+level);r.setAttribute('role','button');r.setAttribute('tabindex','0');r.setAttribute('data-key',key);r.setAttribute('data-name',name);
  if(kind)dot(r,kind);appendName(r,name);return r;
}

function selection(type,i,j,k,t=0){return {type,i,j,k,t,key:type==='top'?'top-'+t:type==='dai'?'dai-'+i:type==='chu'?'dai-'+i+'-chu-'+j:'dai-'+i+'-chu-'+j+'-item-'+k};}
function nameOf(s){const data=DATA[state.side];return s.type==='top'?data.top[s.t]:s.type==='dai'?data.dai[s.i].name:s.type==='chu'?data.dai[s.i].chu[s.j].name:data.dai[s.i].chu[s.j].items[s.k];}
function go(s,reveal=true){
  const local=state[state.side];local.selected=s;
  if(reveal&&s.type!=='top'){local.open.add('dai-'+s.i);if(s.type!=='dai')local.open.add('dai-'+s.i+'-chu-'+s.j);}
  renderNav();renderContent();
}
function renderNav(){
  const nav=document.getElementById('nav');nav.replaceChildren();const data=DATA[state.side],local=state[state.side];
  function entry(name,level,s,kind,kids){
    const r=row(name,level,s.key,kind);
    if(local.selected.key===s.key){r.classList.add('current');r.setAttribute('aria-current','page');}
    if(kids){const open=local.open.has(s.key);kids.hidden=!open;kids.id=state.side+'-'+s.key+'-children';r.setAttribute('aria-expanded',String(open));r.setAttribute('aria-controls',kids.id);r.appendChild(element('span','chevron'));}
    bind(r,()=>{if(kids){if(local.open.has(s.key))local.open.delete(s.key);else local.open.add(s.key);}go(s,false);document.getElementById('nav').querySelector('[data-key="'+s.key+'"]').focus();});return r;
  }
  data.top.forEach((name,t)=>nav.appendChild(entry(name,'top',selection('top',undefined,undefined,undefined,t))));
  data.dai.forEach((d,i)=>{
    const children=element('div','dai-children');
    d.chu.forEach((c,j)=>{const details=element('div','chu-children');
      c.items.forEach((name,k)=>details.appendChild(entry(name,'detail',selection('detail',i,j,k))));
      children.appendChild(entry(c.name,'chu',selection('chu',i,j),state.side==='ura'?c.name:null,details));children.appendChild(details);
    });
    nav.appendChild(entry(d.name,'dai',selection('dai',i),null,children));nav.appendChild(children);
  });
}
function action(name,cls,s){const r=row(name,cls,s.key);r.setAttribute('data-target',s.type);bind(r,()=>go(s));return r;}
function kindBadge(parent,kind){const badge=element('span','kind',kind);badge.style.setProperty('--kind',COLORS[kind]);parent.appendChild(badge);}
function diagram(parent,name,s,small=false){const r=action(name,'frame diagram'+(small?' small':''),s);r.appendChild(element('small','','ここに図'));parent.appendChild(r);}
function renderContent(){
  const content=document.getElementById('content');content.replaceChildren();const s=state[state.side].selected,data=DATA[state.side],front=state.side==='omote';
  content.setAttribute('data-screen',s.type);
  const breadcrumb=element('p','breadcrumb');
  const path=[{name:data.title,s:selection('top')}];
  if(s.type!=='top'){
    path.push({name:data.dai[s.i].name,s:selection('dai',s.i)});
    if(s.type!=='dai')path.push({name:data.dai[s.i].chu[s.j].name,s:selection('chu',s.i,s.j)});
    if(s.type==='detail')path.push({name:nameOf(s),s});
  }else path.push({name:nameOf(s),s});
  path.forEach((p,n)=>{if(n)breadcrumb.appendChild(element('span','',' › '));breadcrumb.appendChild(action(p.name,'crumb',p.s));});content.appendChild(breadcrumb);
  const heading=element('h2');appendName(heading,!front&&s.type==='chu'?data.dai[s.i].name+' › '+nameOf(s):nameOf(s));content.appendChild(heading);
  if(s.type==='top'){
    if(!front)return;
    if(s.t!==0){content.appendChild(element('div','frame','ここに図'));return;}
    const grid=element('div','executive-grid');
    data.dai.forEach((d,i)=>{const section=element('section','executive-section');section.appendChild(action(d.name,'section-head',selection('dai',i)));const images=element('div','diagram-grid compact');d.chu.forEach((c,j)=>diagram(images,c.name,selection('chu',i,j),true));section.appendChild(images);grid.appendChild(section);});content.appendChild(grid);return;
  }
  if(s.type==='dai'){
    content.appendChild(element('p','screen-label',front?'大テーマのダッシュボード':'決定と設定'));
    const grid=element('div','diagram-grid');data.dai[s.i].chu.forEach((c,j)=>{
      if(front)diagram(grid,c.name,selection('chu',s.i,j));
      else{const section=action(c.name,'setting-section',selection('chu',s.i,j));dot(section,c.name);section.appendChild(element('span','item-count',String(c.items.length)));grid.appendChild(section);}
    });content.appendChild(grid);return;
  }
  const c=data.dai[s.i].chu[s.j];
  if(s.type==='chu'){
    if(front){content.appendChild(element('p','screen-label','中テーマのダッシュボード'));const grid=element('div','diagram-grid');c.items.forEach((name,k)=>diagram(grid,name,selection('detail',s.i,s.j,k)));content.appendChild(grid);}
    else{const kind=element('div','kind-heading');dot(kind,c.name);kindBadge(kind,c.name);content.appendChild(kind);const list=element('div','setting-list');c.items.forEach((name,k)=>{const r=action(name,'setting-row',selection('detail',s.i,s.j,k));const empty=element('span','input-shape');empty.setAttribute('aria-hidden','true');r.appendChild(empty);list.appendChild(r);});content.appendChild(list);}return;
  }
  if(front)content.appendChild(element('p','screen-label','詳細ダッシュボード'));else kindBadge(content,c.name);
  const captions={'決定':'ここで決める','設定':'ここに事実を入れる','接続・取り込み':'ここで外とつなぐ・取り込む'};
  content.appendChild(element('div','frame '+(front?'detail-frame':'ura'),front?'ここに図（チャート・グラフ）':captions[c.name]));
}
function switchSide(side){
  state.side=side;
  document.getElementById('tabs').querySelectorAll('[role="tab"]').forEach(tab=>{const selected=tab.getAttribute('data-side')===side;tab.setAttribute('aria-selected',String(selected));tab.setAttribute('tabindex',selected?'0':'-1');});
  document.getElementById('panel').setAttribute('aria-labelledby','tab-'+side);
  document.getElementById('lead').textContent=DATA[side].lead;renderNav();renderContent();
}
function counts(data){const chu=data.dai.flatMap(d=>d.chu);return {dai:data.dai.length,chu:chu.length,items:chu.reduce((sum,c)=>sum+c.items.length,0),kinds:chu.reduce((sum,c)=>{sum[c.name]=(sum[c.name]||0)+c.items.length;return sum;},{})};}
function renderAll(){
  const all=document.getElementById('all');
  Object.entries(DATA).forEach(([side,data])=>{
    const section=element('section','all');section.appendChild(element('h3','',(side==='omote'?'表＝':'裏＝')+data.title));const n=counts(data);
    let text='大テーマ '+n.dai+'・中テーマ '+n.chu+'・各詳細 '+n.items;
    if(side==='ura')text+='・'+Object.keys(COLORS).map(kind=>kind+' '+(n.kinds[kind]||0)).join('・');
    section.appendChild(element('p','counts',text));
    function line(name,level,kind){const r=element('div','all-row '+level);if(kind)dot(r,kind);appendName(r,name);section.appendChild(r);}
    data.top.forEach(name=>line(name,'top'));
    data.dai.forEach(d=>{line(d.name,'dai');d.chu.forEach(c=>{line(c.name,'chu',side==='ura'?c.name:null);c.items.forEach(name=>line(name,'detail'));});});all.appendChild(section);
  });
}

Object.entries(DATA).forEach(([side,data])=>{
  const tab=element('button','tab',(side==='omote'?'表＝':'裏＝')+data.title);tab.id='tab-'+side;tab.type='button';tab.setAttribute('role','tab');tab.setAttribute('data-side',side);tab.setAttribute('aria-controls','panel');bind(tab,()=>switchSide(side));
  tab.addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const next=event.key==='Home'?'omote':event.key==='End'?'ura':state.side==='omote'?'ura':'omote';switchSide(next);document.getElementById('tab-'+next).focus();}});
  document.getElementById('tabs').appendChild(tab);
});
renderAll();switchSide('omote');
</script>
</body>
</html>
